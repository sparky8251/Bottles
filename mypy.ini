[mypy]
# TODO This errors needs to be fixed one by one
disable_error_code = assignment, index, valid-type, misc, union-attr, arg-type, operator, call-overload, var-annotated, attr-defined

# No type stubs exist for these libraries; without this every file importing
# them fails the check for a reason the code cannot fix.
[mypy-pefile.*]
ignore_missing_imports = True
[mypy-patoolib.*]
ignore_missing_imports = True
[mypy-yara.*]
ignore_missing_imports = True
