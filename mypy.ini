[mypy]
# TODO This errors needs to be fixed one by one
disable_error_code = assignment, index, valid-type, misc, union-attr, arg-type, operator, call-overload, var-annotated, attr-defined

# No type stubs exist for these libraries; without this every file importing
# them fails the check for a reason the code cannot fix.
[mypy-pefile.*]
ignore_missing_imports = True
[mypy-patoolib.*]
ignore_missing_imports = True
[mypy-yara.*]
ignore_missing_imports = True

# The steps grammar, frontend and machine are typed strictly, and
# steps/conformance.py asserts that every executor satisfies the Executor
# Protocol; the blanket disables above would hide a missing opcode method.
# The executors themselves hold handler bodies moved as they were and keep
# the global settings.
[mypy-bottles.backend.steps.grammar,bottles.backend.steps.yaml_frontend,bottles.backend.steps.machine,bottles.backend.steps.conformance]
enable_error_code = arg-type, attr-defined, misc, union-attr, assignment
