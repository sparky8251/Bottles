[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"

[tool.ruff]
exclude = [
	"bottles/backend/utils/nvidia.py",
	"bottles/backend/utils/vdf.py",
]

[tool.ruff.lint]
# E402 and E701 are style; F841 (unused local) is a correctness smell. All three
# are violated across the tree today and are ignored only so `ruff check` passes
# without a tree-wide rewrite (see the TODO in .pre-commit-config.yaml). Rules
# such as F821 that mean a crash stay enforced.
ignore = ["F401", "F402", "E722", "E741", "E402", "E701", "F841"]
