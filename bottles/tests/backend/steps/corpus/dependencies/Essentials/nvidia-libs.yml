Name: nvidia-libs
Description: NVIDIA CUDA, NVENC and OptiX libraries for Wine
Provider: SveSop
License: LGPL-2.1-or-later
License_url: https://github.com/SveSop/nvidia-libs/blob/master/LICENSE
Dependencies: []
Steps:
- action: archive_extract
  file_name: nvidia-libs-v1.0.2.tar.xz
  url: https://github.com/SveSop/nvidia-libs/releases/download/v1.0.2/nvidia-libs-v1.0.2.tar.xz
  file_checksum: 070373ec3de2e547eaf157e347a36a62
  file_size: 2545212

- action: copy_dll
  url: temp/nvidia-libs-v1.0.2.tar/nvidia-libs-v1.0.2/x64/
  file_name: nvcuda.dll
  dest: win64

- action: copy_dll
  url: temp/nvidia-libs-v1.0.2.tar/nvidia-libs-v1.0.2/x64/
  file_name: nvcuvid.dll
  dest: win64

- action: copy_dll
  url: temp/nvidia-libs-v1.0.2.tar/nvidia-libs-v1.0.2/x64/
  file_name: nvencodeapi64.dll
  dest: win64

- action: copy_dll
  url: temp/nvidia-libs-v1.0.2.tar/nvidia-libs-v1.0.2/x64/
  file_name: nvofapi64.dll
  dest: win64

- action: copy_dll
  url: temp/nvidia-libs-v1.0.2.tar/nvidia-libs-v1.0.2/x64/
  file_name: nvoptix.dll
  dest: win64

- action: override_dll
  bundle:
    - value: nvcuda
      data: native
    - value: nvcuvid
      data: native
    - value: nvencodeapi64
      data: native
    - value: nvofapi64
      data: native
    - value: nvoptix
      data: native
